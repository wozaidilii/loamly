# DNS (Aliyun): A record  convert.loamly.cn  →  39.103.98.109
# Deploy root: upload site files to /var/www/convert
# Then: ln -s this file into sites-enabled (or include) and nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name convert.loamly.cn;

    root /var/www/convert;
    index index.html;

    # WASM MIME (required)
    types {
        application/wasm wasm;
        application/javascript mjs;
    }
    include mime.types;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for vendor / hashed-ish static assets
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /css/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /js/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Do not add Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy.
}
