<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="图片、PDF 格式转换，在浏览器里完成，文件不上传。" />
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <title>文件转换</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./">
        <img class="brand-icon" src="./logo.svg" alt="" />
        <span class="brand-name" id="brand-name">文件转换</span>
      </a>
      <nav class="topbar-nav">
        <a href="./about.html">关于与许可证</a>
      </nav>
    </header>

    <main class="main">
      <div class="title-block">
        <p class="subtitle" id="hero-tagline">图片、PDF 格式转换，在浏览器里完成，文件不上传。</p>
        <div class="tags" id="hero-tags">
          <span class="tag">免费使用</span>
          <span class="tag">文件不上传</span>
        </div>
      </div>

      <div class="dropzone" id="drop" role="button" tabindex="0" aria-label="拖文件到这里">
        <div class="dropzone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 18h16"/></svg>
        </div>
        <div class="dropzone-label">拖文件到这里</div>
        <button class="btn btn-primary" type="button" id="pick-btn">选文件</button>
        <input type="file" id="file-input" multiple hidden
          accept="image/*,.heic,.heif,application/pdf" />
      </div>

      <div class="quality-row" id="quality-row" hidden>
        <label for="quality">图片质量</label>
        <input type="range" id="quality" min="50" max="100" value="90" />
        <span id="quality-val" class="file-size">90</span>
      </div>

      <section class="file-panel" id="file-panel" hidden>
        <div class="file-panel-actions" id="panel-actions">
          <button class="btn btn-ghost" type="button" id="clear-btn">清空</button>
          <button class="btn btn-download" type="button" id="dl-all" hidden>全部下载</button>
        </div>
        <div id="file-list"></div>
      </section>

      <div class="ad-slot-mobile" id="ad-slot-mobile" aria-hidden="true"></div>

      <footer class="footer">
        基于开源项目 <a href="https://github.com/KnifeLemon/Filee" target="_blank" rel="noopener">Filee</a>（MIT）<span class="sep">·</span>栖于垄上（上海）网络科技有限公司<span class="sep">·</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026030604号</a>
      </footer>
    </main>

    <aside class="ad-slot" id="ad-slot" aria-hidden="true"></aside>
  </div>

  <script src="./js/config.js"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script src="./vendor/pdf-lib/pdf-lib.min.js"></script>
  <script src="./vendor/heic2any/heic2any.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
