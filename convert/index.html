<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  <title>文件转换</title>
  <meta name="description" content="图片、PDF、音视频格式转换，在浏览器里完成，文件不上传。免费使用。" />
  <link rel="canonical" href="https://convert.loamly.cn/" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="文件转换" />
  <meta property="og:title" content="文件转换" />
  <meta property="og:description" content="图片、PDF、音视频格式转换，在浏览器里完成，文件不上传。免费使用。" />
  <meta property="og:url" content="https://convert.loamly.cn/" />
  <meta property="og:image" content="https://convert.loamly.cn/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="文件转换" />
  <meta name="twitter:description" content="图片、PDF、音视频格式转换，在浏览器里完成，文件不上传。免费使用。" />
  <meta name="twitter:image" content="https://convert.loamly.cn/og.png" />
  <meta itemprop="name" content="文件转换" />
  <meta itemprop="description" content="图片、PDF、音视频格式转换，在浏览器里完成，文件不上传。免费使用。" />
  <meta itemprop="image" content="https://convert.loamly.cn/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/app.css?v=20261029b" />
</head>
<body>
  <div style="display:none"><img src="./apple-touch-icon.png" alt="" width="300" height="300" /></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./">
        <img class="brand-icon" src="./logo.svg" alt="" />
        <span class="brand-name" id="brand-name">文件转换</span>
      </a>
      <nav class="topbar-nav">
        <a href="./about.html">关于与许可证</a>
      </nav>
    </header>

    <div class="stage" id="stage">
      <div class="idle-hero" id="idle-hero">
        <p class="idle-subtitle" id="hero-tagline">图片、PDF 格式转换，在浏览器里完成，文件不上传。</p>
        <div class="tags" id="hero-tags"><span class="tag">免费使用</span></div>
      </div>
      <div class="drop" id="drop">
        <div class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 18h16"/></svg>
        </div>
        <div class="drop-label">拖文件到这里</div>
        <button class="btn btn-primary" type="button" id="btn-pick">选文件</button>
        <input id="file-input" type="file" multiple accept="image/*,.heic,.heif,.bmp,.tif,.tiff,.ico,.avif,application/pdf,audio/*,video/*,.mp3,.m4a,.wav,.ogg,.opus,.flac,.webm,.mp4,.mov,.mkv" hidden />
        <p class="drop-error" id="drop-error" hidden></p>
      </div>

      <div class="tree" id="tree" aria-live="polite">
        <svg class="tree-svg" id="tree-svg" aria-hidden="true"></svg>
        <button type="button" class="center-node" id="center-node" aria-label="换文件">
          <span class="ext" id="center-ext">PNG</span>
          <span class="sub" id="center-sub"></span>
        </button>
        <div id="targets"></div>
        <div class="tree-controls" id="tree-controls">
          <div class="quality-row" id="quality-row">
            <label for="quality">质量</label>
            <input type="range" id="quality" min="50" max="100" value="90" />
            <span id="quality-val" class="quality-val">90</span>
          </div>
          <div class="range-row" id="range-row">
            <label for="page-range">页码</label>
            <input type="text" id="page-range" inputmode="numeric" placeholder="如 1-3,5" autocomplete="off" />
          </div>
          <button class="btn-change-file" type="button" id="btn-change-file">换文件</button>
        </div>
      </div>

      <p class="hint" id="hint">文件不上传</p>
    </div>

    <button class="btn-change-file mobile-change-file" type="button" id="btn-change-file-mobile" hidden>换文件</button>

    <footer class="footer">
      <span id="footer-version">v0.3f</span><span class="sep">·</span>基于开源项目 <a href="https://github.com/KnifeLemon/Filee" target="_blank" rel="noopener">Filee</a>（MIT）<span class="sep">·</span>栖于垄上（上海）网络科技有限公司<span class="sep">·</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026030604号</a>
    </footer>
  </div>

  <script src="./js/config.js?v=20261029b"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script src="./vendor/pdf-lib/pdf-lib.min.js"></script>
  <script src="./vendor/heic2any/heic2any.min.js"></script>
  <script type="module" src="./js/app.js?v=20261029b"></script>
</body>
</html>
