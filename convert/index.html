<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  <title>文件转换</title>
  <link rel="stylesheet" href="./css/app.css?v=20261027f" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./">
        <img class="brand-icon" src="./logo.svg" alt="" />
        <span class="brand-name" id="brand-name">文件转换</span>
      </a>
      <nav class="topbar-nav">
        <a href="./about.html">关于与许可证</a>
      </nav>
    </header>

    <div class="stage" id="stage">
      <div class="idle-hero" id="idle-hero">
        <p class="idle-subtitle" id="hero-tagline">图片、PDF 格式转换，在浏览器里完成，文件不上传。</p>
        <div class="tags" id="hero-tags"><span class="tag">免费使用</span></div>
      </div>
      <div class="drop" id="drop">
        <div class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 18h16"/></svg>
        </div>
        <div class="drop-label">拖文件到这里</div>
        <button class="btn btn-primary" type="button" id="btn-pick">选文件</button>
        <input id="file-input" type="file" multiple accept="image/*,.heic,.heif,.bmp,.tif,.tiff,.ico,.avif,application/pdf,audio/*,video/*,.mp3,.m4a,.wav,.ogg,.opus,.flac,.webm,.mp4,.mov,.mkv" hidden />
        <p class="drop-error" id="drop-error" hidden></p>
      </div>

      <div class="tree" id="tree" aria-live="polite">
        <svg class="tree-svg" id="tree-svg" aria-hidden="true"></svg>
        <div class="center-node" id="center-node">
          <span class="ext" id="center-ext">PNG</span>
          <span class="sub" id="center-sub"></span>
        </div>
        <div id="targets"></div>
      </div>

      <p class="hint" id="hint">文件不上传</p>

      <div class="quality-row" id="quality-row">
        <label for="quality">图片质量</label>
        <input type="range" id="quality" min="50" max="100" value="90" />
        <span id="quality-val" class="quality-val">90</span>
      </div>

      <div class="range-row" id="range-row">
        <label for="page-range">页码</label>
        <input type="text" id="page-range" inputmode="numeric" placeholder="如 1-3,5" autocomplete="off" />
      </div>

      <div class="tree-actions" id="tree-actions">
        <button class="btn btn-text" type="button" id="btn-again">再转一个</button>
      </div>
    </div>

    <footer class="footer">
      <span id="footer-version">v0.3</span><span class="sep">·</span>基于开源项目 <a href="https://github.com/KnifeLemon/Filee" target="_blank" rel="noopener">Filee</a>（MIT）<span class="sep">·</span>栖于垄上（上海）网络科技有限公司<span class="sep">·</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026030604号</a>
    </footer>
  </div>

  <script src="./js/config.js?v=20261027f"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script src="./vendor/pdf-lib/pdf-lib.min.js"></script>
  <script src="./vendor/heic2any/heic2any.min.js"></script>
  <script type="module" src="./js/app.js?v=20261027f"></script>
</body>
</html>
